name: Stock watchers

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（UTC基準・多少遅延あり）
  workflow_dispatch:
    inputs:
      target:
        description: "監視対象。空なら定期実行と同じ（apple-16e）。montbell を指定すれば手動でも試せる"
        required: false
        default: ""

permissions:
  contents: write             # state_*.json のコミットに必要

concurrency:
  group: stock-watchers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watchers
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          # workflow_dispatch で target 指定があればそれだけ、無ければ定期実行の対象。
          # montbell は Actions の IP から遮断されていて毎回60秒タイムアウトするだけなので
          # 定期実行からは外してある（コードは残置。手動 dispatch / ローカルでは動く）。
          targets="${INPUT_TARGET:-apple-16e}"
          for t in $targets; do
            echo "===== $t ====="
            WATCH_TARGET="$t" python check.py || echo "[warn] $t 失敗（続行）"
          done

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state_*.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_*.json
            git commit -m "Update notified state"
            git push
          fi
