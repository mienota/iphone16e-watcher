name: Stock watchers

on:
  schedule:
    # cronはUTC。GitHub側の混雑で間引かれるので「最短でもこの間隔」という意味。
    - cron: "*/10 * * * *"   # 高頻度: apple-16e（整備済は早い者勝ち）
    # montbell は runner のIPによって遮断されたりされなかったりする（1/3くらい失敗）。
    # 1日1回だと外れた日が丸ごと欠測になるので、時間を散らして1日3回叩く。
    # 在庫が続いている間は再通知しない仕組みなので、通知が3倍になることはない。
    - cron: "5 23 * * *"     # 08:05 JST
    - cron: "5 4 * * *"      # 13:05 JST
    - cron: "5 10 * * *"     # 19:05 JST
  workflow_dispatch:
    inputs:
      target:
        description: "監視対象。空なら定期実行と同じ（apple-16e）。montbell を指定すれば手動でも試せる"
        required: false
        default: ""

permissions:
  contents: write             # state_*.json のコミットに必要

concurrency:
  group: stock-watchers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watchers
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_APPLE: ${{ secrets.NTFY_TOPIC_APPLE }}
          NTFY_TOPIC_MONTBELL: ${{ secrets.NTFY_TOPIC_MONTBELL }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 対象の決め方:
          #   手動で target 指定あり … それだけ
          #   10分ごとのcron        … apple-16e
          #   それ以外のcron        … montbell（時刻を足しても下の分岐は触らなくていい）
          #   手動で target 空欄     … 全部（動作確認用）
          # montbell は runner のIPしだいで接続タイムアウトする。失敗しても
          # find_items の「数量セレクト0件」ガードがあるので、黙って「完売」と
          # 誤報することはなく、単にその回が欠測になるだけ。
          if [ -n "$INPUT_TARGET" ]; then
            targets="$INPUT_TARGET"
          elif [ "$SCHEDULE" = "*/10 * * * *" ]; then
            targets="apple-16e"
          elif [ -n "$SCHEDULE" ]; then
            targets="montbell"
          else
            targets="apple-16e montbell"
          fi
          echo "対象: $targets"
          for t in $targets; do
            echo "===== $t ====="
            WATCH_TARGET="$t" python check.py || echo "[warn] $t 失敗（続行）"
          done

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state_*.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_*.json
            git commit -m "Update notified state"
            git push
          fi
