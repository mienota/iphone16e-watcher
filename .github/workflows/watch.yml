name: Stock watchers

on:
  schedule:
    # cronはUTC。GitHub側の混雑で間引かれるので「最短でもこの間隔」という意味。
    - cron: "*/10 * * * *"   # 高頻度: apple-16e（整備済は早い者勝ち）
    - cron: "5 23 * * *"     # 1日1回 08:05 JST: montbell（再入荷は急がない）
  workflow_dispatch:
    inputs:
      target:
        description: "監視対象。空なら定期実行と同じ（apple-16e）。montbell を指定すれば手動でも試せる"
        required: false
        default: ""

permissions:
  contents: write             # state_*.json のコミットに必要

concurrency:
  group: stock-watchers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watchers
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_APPLE: ${{ secrets.NTFY_TOPIC_APPLE }}
          NTFY_TOPIC_MONTBELL: ${{ secrets.NTFY_TOPIC_MONTBELL }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 対象の決め方:
          #   手動で target 指定あり … それだけ
          #   1日1回のcron          … montbell
          #   10分ごとのcron        … apple-16e
          #   手動で target 空欄     … 全部（動作確認用）
          # montbell は一時期 Actions から遮断されていたが 2026-08-09 に復活を確認。
          # 再び遮断されたら find_items が「数量セレクト0件」で落ちるので、
          # 黙って「完売」と誤報することはない（失敗しても他のターゲットは続行）。
          if [ -n "$INPUT_TARGET" ]; then
            targets="$INPUT_TARGET"
          elif [ "$SCHEDULE" = "5 23 * * *" ]; then
            targets="montbell"
          elif [ -n "$SCHEDULE" ]; then
            targets="apple-16e"
          else
            targets="apple-16e montbell"
          fi
          echo "対象: $targets"
          for t in $targets; do
            echo "===== $t ====="
            WATCH_TARGET="$t" python check.py || echo "[warn] $t 失敗（続行）"
          done

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state_*.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_*.json
            git commit -m "Update notified state"
            git push
          fi
