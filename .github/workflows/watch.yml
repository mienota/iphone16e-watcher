name: Watch iPhone 16e refurbished

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと（UTC基準・多少遅延あり）
  workflow_dispatch:
    inputs:
      model:
        description: "監視対象モデル(スラグ)。例: 16e / 15-plus"
        required: false
        default: "16e"

permissions:
  contents: write             # state.json のコミットに必要

concurrency:
  group: watch-iphone16e
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Apple refurbished store
        env:
          WATCH_MODEL: ${{ github.event.inputs.model || '16e' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check.py

      - name: Commit state if changed
        run: |
          if ! git diff --quiet -- state_*.json 2>/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_*.json
            git commit -m "Update notified state"
            git push
          fi
